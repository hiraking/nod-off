# file.encoding=COMPAT（OS の文字コード）：ユーザー名に日本語が入るパスでも、テストの実行器が起動するようにする。
# Kotlin のソースは常に UTF-8 で読まれる。テストの中の文字コードは app/build.gradle.kts で UTF-8 にしている
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=COMPAT
# ユーザー名に日本語が入るパスでは、AGP が警告して止まる
android.overridePathCheck=true
android.useAndroidX=true
kotlin.code.style=official
